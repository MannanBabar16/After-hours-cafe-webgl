<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Hours Café · feedback preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4e8d6;color:#493c2f;font:16px/1.6 Arial,sans-serif}main{max-width:800px;margin:28px auto;padding:0 18px 60px}.banner{display:block;width:100%;border-radius:20px;border:1px solid #dfd1b8;margin-bottom:18px}.notice{font-size:12px;color:#35664f;padding:10px 16px;border:1px dashed #8da887;border-radius:12px;margin-bottom:18px}.intro,.question,.section{background:#fffbf1;border:1px solid #e3d7c5;border-radius:16px;padding:24px;margin-bottom:14px}.intro{border-top:7px solid #35664f}h1{font:italic 32px/1.2 Georgia,serif;margin:0 0 13px}h2{font-size:17px;margin:0 0 8px}.intro p,.section p{margin:0;color:#6c7563;font-size:14px}.section{background:#dfe6d2}.section h2{font-size:15px;color:#35664f}fieldset{border:0;padding:0;margin:0}legend{font-size:17px;font-weight:600;margin-bottom:12px;float:left;width:100%}.options{clear:both}label{display:flex;align-items:center;gap:13px;min-height:48px;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer}label:hover,label:has(input:checked){background:#eaf0df}input{accent-color:#35664f;width:18px;height:18px;flex-shrink:0}input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #bb813a;outline-offset:3px}textarea{width:100%;min-height:85px;font:inherit;resize:vertical;border:1px solid #b8c6ae;border-radius:9px;padding:12px;background:#fffdf7}.help{font-size:12px;color:#727c67;margin:0 0 12px}.optional{font-size:12px;color:#727c67;font-weight:400}.required{color:#8e422d;font-size:14px}button{border:0;border-radius:10px;background:#35664f;color:#fff6e4;padding:13px 26px;min-height:48px;font:600 14px Arial,sans-serif;cursor:pointer}button.secondary{background:#e0e7d2;color:#35664f}.actions{display:flex;justify-content:space-between;margin-top:20px}.foot{font-size:12px;color:#7e7d69;text-align:center;margin-top:26px}#done{display:none}.check{color:#35664f;font-size:40px;margin-bottom:8px}@media(max-width:520px){main{margin:16px auto;padding:0 12px 40px}.intro,.question,.section{padding:20px}h1{font-size:27px}.banner{border-radius:13px}label{font-size:14px}}
</style></head><body><main><img class="banner" src="header.svg" alt="After Hours Café — A few taps. A better next evening."><div class="notice">Design preview · answers stay in this page and are never sent. The published Google Form will use Google's native controls and this question flow.</div><div class="intro"><h1 id="title"></h1><p id="description"></p></div><form id="feedback"><div id="content"></div><div class="actions"><button class="secondary" type="button" id="back" hidden>Back</button><button type="submit" id="next">Next</button></div></form><section class="intro" id="done"><div class="check">☕</div><h1>A little feedback goes a long way.</h1><p id="confirmation"></p><p style="margin-top:18px">Preview complete. No response was submitted.</p><button type="button" id="restart" style="margin-top:18px">Try another path</button></section><p class="foot">Mannan · After Hours Café · PC game prototype research</p></main><script>
const spec=__FORM_SPEC__;
document.querySelector('#title').textContent=spec.title;
document.querySelector('#description').textContent=spec.description;
document.querySelector('#confirmation').textContent=spec.confirmation;
let stage=0,route=null,answers={};
const form=document.querySelector('#feedback'),content=document.querySelector('#content');
function el(tag,text,cls){const x=document.createElement(tag);if(text)x.textContent=text;if(cls)x.className=cls;return x}
function render(){content.replaceChildren();const group=stage===0?{title:'1 / 3 · a quick check-in',description:'Choose the path that fits you.',questions:[spec.entry]}:stage===1?spec.branches[route]:spec.common;const section=el('div',null,'section');section.append(el('h2',group.title),el('p',group.description));content.append(section);for(const q of group.questions){const card=el('div',null,'question'),fieldset=el('fieldset'),legend=el('legend',q.title+' ');legend.append(el('span',q.required?'*':'(optional)',q.required?'required':'optional'));fieldset.append(legend);if(q.help)fieldset.append(el('p',q.help,'help'));if(q.type==='paragraph'){const area=el('textarea');area.name=q.id;area.setAttribute('aria-label',q.title);area.value=answers[q.id]||'';fieldset.append(area);}else{const options=el('div',null,'options');q.options.forEach((text,i)=>{const label=el('label'),input=el('input');input.type='radio';input.name=q.id;input.value=text;input.required=q.required;input.checked=answers[q.id]===text;label.append(input,el('span',text));options.append(label)});fieldset.append(options)}card.append(fieldset);content.append(card)}document.querySelector('#back').hidden=stage===0;document.querySelector('#next').textContent=stage===2?'Finish preview':'Next';window.scrollTo(0,0);}
function remember(){for(const [key,value] of new FormData(form))answers[key]=value;}
form.addEventListener('submit',e=>{e.preventDefault();remember();if(stage===0){route=spec.entry.routes[spec.entry.options.indexOf(answers.experience)]}if(stage===2){form.hidden=true;document.querySelector('#done').style.display='block';window.scrollTo(0,0);return}stage++;render()});document.querySelector('#back').onclick=()=>{remember();stage--;render()};document.querySelector('#restart').onclick=()=>{stage=0;route=null;answers={};form.hidden=false;document.querySelector('#done').style.display='none';render()};render();
</script></body></html>
